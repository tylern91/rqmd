<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1670" viewBox="0 0 1700 1670" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>rqmd architecture</title>
  <desc>Four-band diagram of rqmd's ingest, storage, query, and surface layers.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <style>
    .band-label { font: bold 16px system-ui, sans-serif; fill: #1e293b; }
    .box-title  { font: bold 13.5px system-ui, sans-serif; fill: #0f172a; }
    .box-sub    { font: 11.5px system-ui, sans-serif; fill: #334155; }
    .box-cite   { font: 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #64748b; }
    .arrow-label{ font: italic 11px system-ui, sans-serif; fill: #475569; }
    .title      { font: bold 26px system-ui, sans-serif; fill: #0f172a; }
    .subtitle   { font: 13px system-ui, sans-serif; fill: #475569; }
    .callout    { font: bold 12.5px system-ui, sans-serif; fill: #7c3aed; }
    .disabled-title { font: bold 13.5px system-ui, sans-serif; fill: #b91c1c; }
    .disabled-sub   { font: 11px system-ui, sans-serif; fill: #7f1d1d; }
    .correction { font: bold 11.5px system-ui, sans-serif; fill: #b91c1c; }
    .legend     { font: 11px system-ui, sans-serif; fill: #64748b; }
    .box   { fill: #ffffff; stroke: #334155; stroke-width: 1.3; }
    .box-deferred { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.3; }
    .box-disabled { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.3; stroke-dasharray: 5,4; }
    .arrow      { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .arrow-dashed { stroke: #b45309; stroke-width: 2; fill: none; stroke-dasharray: 6,4; marker-end: url(#arrow-amber); }
  </style>

  <!-- Background: explicit light fill so the image is legible regardless of page theme -->
  <rect x="0" y="0" width="1700" height="1670" fill="#fbfbfd"/>
  <rect x="1" y="1" width="1698" height="1668" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="850" y="42" text-anchor="middle" class="title">rqmd architecture</text>
  <text x="850" y="64" text-anchor="middle" class="subtitle">Local hybrid search — BM25 (Tantivy) + vector (usearch HNSW) + cross-encoder rerank, no network calls</text>

  <!-- ============================== BAND 1 — INGEST ============================== -->
  <rect x="40" y="85" width="1620" height="345" rx="14" fill="#eef4ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="64" y="115" class="band-label">1 · INGEST — rqmd collection add / rqmd update</text>

  <!-- Row 1: main pipeline -->
  <g>
    <rect x="70" y="140" width="250" height="100" rx="8" class="box"/>
    <text x="84" y="162" class="box-title">Walk</text>
    <text x="84" y="180" class="box-cite">document.rs:97</text>
    <text x="84" y="198" class="box-sub">collect_candidates()</text>
    <text x="84" y="214" class="box-sub">recursive dir walk, filtered</text>
    <text x="84" y="228" class="box-sub">by include/exclude globs</text>
  </g>

  <g>
    <rect x="397" y="140" width="250" height="100" rx="8" class="box"/>
    <text x="411" y="162" class="box-title">Frontmatter split +</text>
    <text x="411" y="178" class="box-title">title resolve</text>
    <text x="411" y="196" class="box-cite">document.rs:124</text>
    <text x="411" y="212" class="box-sub">title: frontmatter → # heading</text>
    <text x="411" y="226" class="box-sub">→ filename stem</text>
  </g>

  <g>
    <rect x="724" y="140" width="250" height="100" rx="8" class="box"/>
    <text x="738" y="162" class="box-title">Hash + docid</text>
    <text x="738" y="180" class="box-cite">db.rs:133</text>
    <text x="738" y="200" class="box-sub">SHA-256(indexed_text)</text>
    <text x="738" y="216" class="box-sub">docid = first 6 hex chars</text>
  </g>

  <g>
    <rect x="1051" y="140" width="250" height="100" rx="8" class="box"/>
    <text x="1065" y="162" class="box-title">New / Updated /</text>
    <text x="1065" y="178" class="box-title">Unchanged</text>
    <text x="1065" y="196" class="box-cite">store.rs:262</text>
    <text x="1065" y="212" class="box-sub">Unchanged ⇒ short-circuit</text>
    <text x="1065" y="226" class="box-sub">(returns early, no writes)</text>
  </g>

  <g>
    <rect x="1378" y="140" width="250" height="100" rx="8" class="box"/>
    <text x="1392" y="162" class="box-title">Tantivy write</text>
    <text x="1392" y="182" class="box-sub">BM25 index updated</text>
    <text x="1392" y="198" class="box-sub">(New / Updated only)</text>
  </g>

  <line x1="320" y1="190" x2="397" y2="190" class="arrow"/>
  <line x1="647" y1="190" x2="724" y2="190" class="arrow"/>
  <line x1="974" y1="190" x2="1051" y2="190" class="arrow"/>
  <line x1="1301" y1="190" x2="1378" y2="190" class="arrow"/>

  <!-- Divider: deferred embed section -->
  <line x1="70" y1="258" x2="1630" y2="258" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="850" y="253" text-anchor="middle" class="arrow-label">deferred / optional — search works fully without ever running embed</text>

  <g>
    <rect x="70" y="272" width="640" height="115" rx="8" class="box-deferred"/>
    <text x="84" y="295" class="box-title">embed  (separate command)</text>
    <text x="84" y="312" class="box-cite">chunking.rs:14–18</text>
    <text x="84" y="330" class="box-sub">not part of update — run manually, later</text>
    <text x="84" y="346" class="box-sub">chunk: 3600 chars · 540-char overlap · 800-char break-point window</text>
    <text x="84" y="362" class="box-sub">never splits inside a fenced code block</text>
  </g>

  <!-- ============================== BAND 2 — STORAGE ============================== -->
  <rect x="40" y="470" width="1620" height="250" rx="14" fill="#f5f0ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="64" y="500" class="band-label">2 · STORAGE</text>

  <g>
    <rect x="70" y="520" width="480" height="150" rx="8" class="box"/>
    <text x="84" y="544" class="box-title">hnsw.usearch</text>
    <text x="84" y="566" class="box-sub">768-dim vectors</text>
    <text x="84" y="584" class="box-sub">cosine metric</text>
    <text x="84" y="602" class="box-sub">keyed by vid</text>
  </g>

  <g>
    <rect x="610" y="520" width="480" height="150" rx="8" class="box"/>
    <text x="624" y="544" class="box-title">index.sqlite  (WAL mode)</text>
    <text x="624" y="566" class="box-sub">tables: content, documents,</text>
    <text x="624" y="582" class="box-sub">content_vectors, store_collections,</text>
    <text x="624" y="598" class="box-sub">store_config</text>
  </g>

  <g>
    <rect x="1150" y="520" width="480" height="150" rx="8" class="box"/>
    <text x="1164" y="544" class="box-title">tantivy/</text>
    <text x="1164" y="566" class="box-sub">field boosts: filepath 1.5 ·</text>
    <text x="1164" y="582" class="box-sub">title 4.0 · body 1.0</text>
    <text x="1164" y="598" class="box-sub">body indexed, NOT stored</text>
  </g>

  <rect x="70" y="685" width="1560" height="30" rx="6" fill="none"/>
  <text x="850" y="705" text-anchor="middle" class="callout">⤷ Replaces qmd's FTS5 + sqlite-vec — the headline architectural divergence from this fork</text>

  <!-- Cross-band arrows: ingest -> storage -->
  <line x1="390" y1="387" x2="310" y2="520" class="arrow"/>
  <line x1="849" y1="240" x2="850" y2="520" class="arrow"/>
  <line x1="1503" y1="240" x2="1390" y2="520" class="arrow"/>

  <!-- ============================== BAND 3 — QUERY ============================== -->
  <rect x="40" y="760" width="1620" height="340" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="64" y="790" class="band-label">3 · QUERY</text>

  <g>
    <rect x="70" y="815" width="170" height="100" rx="8" class="box"/>
    <text x="84" y="838" class="box-title">Parse</text>
    <text x="84" y="856" class="box-cite">query.rs:42</text>
    <text x="84" y="874" class="box-sub">parse_query()</text>
  </g>

  <g>
    <rect x="273" y="815" width="180" height="100" rx="8" class="box"/>
    <text x="287" y="838" class="box-title">BM25 probe</text>
    <text x="287" y="858" class="box-sub">initial FTS lookup</text>
    <text x="287" y="874" class="box-sub">top + second score</text>
  </g>

  <g>
    <rect x="487" y="815" width="200" height="100" rx="8" class="box"/>
    <text x="501" y="838" class="box-title">Strong signal?</text>
    <text x="501" y="856" class="box-sub">top ≥ 0.85 &amp;</text>
    <text x="501" y="872" class="box-sub">gap ≥ 0.15</text>
    <text x="501" y="900" class="box-cite">store.rs:742</text>
  </g>

  <g>
    <rect x="720" y="815" width="240" height="100" rx="8" class="box"/>
    <text x="734" y="838" class="box-title">RRF fusion</text>
    <text x="734" y="855" class="box-cite">rrf.rs</text>
    <text x="734" y="872" class="box-sub">k = 60 · orig 2.0 · expand 1.0</text>
    <text x="734" y="888" class="box-sub">top-rank bonus +0.05 / +0.02</text>
  </g>

  <g>
    <rect x="994" y="815" width="190" height="100" rx="8" class="box"/>
    <text x="1008" y="838" class="box-title">Best-chunk</text>
    <text x="1008" y="856" class="box-title">selection</text>
  </g>

  <g>
    <rect x="1217" y="815" width="210" height="100" rx="8" class="box"/>
    <text x="1231" y="838" class="box-title">Cross-encoder</text>
    <text x="1231" y="856" class="box-title">rerank</text>
    <text x="1231" y="875" class="box-cite">Qwen3-Reranker-0.6B</text>
  </g>

  <g>
    <rect x="1460" y="815" width="170" height="100" rx="8" class="box"/>
    <text x="1474" y="838" class="box-title">Final blend</text>
    <text x="1474" y="858" class="box-sub">0.75 × rerank</text>
    <text x="1474" y="874" class="box-sub">+ 0.25 × RRF</text>
  </g>

  <line x1="240" y1="865" x2="273" y2="865" class="arrow"/>
  <line x1="453" y1="865" x2="487" y2="865" class="arrow"/>
  <line x1="687" y1="865" x2="720" y2="865" class="arrow"/>
  <text x="703" y="808" text-anchor="middle" class="arrow-label">yes: skip expansion</text>
  <line x1="960" y1="865" x2="994" y2="865" class="arrow"/>
  <line x1="1184" y1="865" x2="1217" y2="865" class="arrow"/>
  <line x1="1427" y1="865" x2="1460" y2="865" class="arrow"/>

  <!-- Branch: expansion path -->
  <path d="M 587 915 L 620 955" class="arrow-dashed"/>
  <text x="560" y="940" text-anchor="middle" class="arrow-label">no: expand</text>
  <path d="M 830 955 L 840 915" class="arrow-dashed"/>

  <g>
    <rect x="508" y="955" width="430" height="115" rx="8" class="box-deferred"/>
    <text x="522" y="978" class="box-title">Expand: lex / vec / hyde</text>
    <text x="522" y="998" class="box-sub">each sub-query gets a BM25 + vector pass</text>
    <text x="522" y="1016" class="box-sub">hyde uses the passage-side prompt</text>
    <text x="522" y="1032" class="box-sub">(embeds a hypothetical doc, not the query)</text>
  </g>

  <!-- ============================== BAND 4 — SURFACES ============================== -->
  <rect x="40" y="1140" width="1620" height="480" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="64" y="1170" class="band-label">4 · SURFACES</text>

  <g>
    <rect x="70" y="1190" width="740" height="190" rx="8" class="box"/>
    <text x="84" y="1215" class="box-title">MCP server — 5 tools</text>
    <text x="84" y="1240" class="box-sub">query · search · get ·</text>
    <text x="84" y="1258" class="box-sub">multi_get · status</text>
    <text x="84" y="1290" class="correction">NO ingest tool</text>
  </g>

  <g>
    <rect x="890" y="1190" width="740" height="190" rx="8" class="box"/>
    <text x="904" y="1215" class="box-title">CLI-only</text>
    <text x="904" y="1240" class="box-sub">vsearch · similar · embed ·</text>
    <text x="904" y="1258" class="box-sub">update · collection ·</text>
    <text x="904" y="1276" class="box-sub">context · doctor</text>
  </g>

  <text x="850" y="1405" text-anchor="middle" class="band-label">Models &amp; inference behavior</text>

  <g>
    <rect x="70" y="1420" width="350" height="170" rx="8" class="box"/>
    <text x="84" y="1444" class="box-title">embed model</text>
    <text x="84" y="1464" class="box-cite">ggml-org/embeddinggemma-300M-GGUF</text>
    <text x="84" y="1484" class="box-sub">768-dim output</text>
  </g>

  <g>
    <rect x="473" y="1420" width="350" height="170" rx="8" class="box"/>
    <text x="487" y="1444" class="box-title">rerank model</text>
    <text x="487" y="1464" class="box-cite">ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF</text>
    <text x="487" y="1484" class="box-sub">causal decoder, ctx.decode()</text>
  </g>

  <g>
    <rect x="876" y="1420" width="350" height="170" rx="8" class="box"/>
    <text x="890" y="1444" class="box-title">generate model</text>
    <text x="890" y="1460" class="box-sub">(query expansion)</text>
    <text x="890" y="1480" class="box-cite">ggml-org/Qwen3-1.7B-GGUF</text>
    <text x="890" y="1500" class="correction">STOCK — no adapter</text>
    <text x="890" y="1516" class="box-sub">(old diagram wrongly said "+ LoRA")</text>
  </g>

  <g>
    <rect x="1279" y="1420" width="350" height="170" rx="8" class="box-disabled"/>
    <text x="1293" y="1444" class="disabled-title">GBNF grammar: DISABLED</text>
    <text x="1293" y="1464" class="disabled-sub">uncatchable GGML_ASSERT crosses</text>
    <text x="1293" y="1480" class="disabled-sub">the FFI boundary (lib.rs:572-587)</text>
    <text x="1293" y="1498" class="disabled-sub">→ lenient line parser + sampler</text>
    <text x="1293" y="1514" class="disabled-sub">(temp 0.7 · top_k 40 · top_p 0.9)</text>
  </g>

  <!-- Legend -->
  <line x1="640" y1="1645" x2="675" y2="1645" class="arrow"/>
  <text x="683" y="1649" class="legend">default pipeline</text>
  <line x1="850" y1="1645" x2="885" y2="1645" class="arrow-dashed"/>
  <text x="893" y="1649" class="legend">deferred / alternate path</text>
</svg>
