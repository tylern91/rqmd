# cargo-audit config, read by `cargo audit` and by rustsec/audit-check in
# .github/workflows/security.yml.
#
# Every entry needs a reason and a removal trigger. An ignore is not a fix:
# it covers an advisory whose patched release is still inside the 30-day
# soak (CONTRIBUTING.md, "Dependency updates"), and it comes out with the
# bump that makes the patched release resolvable.

[advisories]
ignore = [
    # paste 1.0.15 is unmaintained (RUSTSEC-2024-0436), a maintenance notice
    # and not a vulnerability. It is a proc-macro reached only through
    # tokenizers 0.23.2 -> macro_rules_attribute, and tokenizers is pulled in
    # only by the optional `ort-backend` feature of rqmd-llm.
    # lean: remove when a tokenizers release drops macro_rules_attribute.
    "RUSTSEC-2024-0436",

    # libsqlite3-sys 0.38.2 bundles SQLite 3.53.2 (RUSTSEC-2026-0459,
    # CVE-2026-119375, CVSS 4.0 local): opening a database together with a
    # `-wal` file whose page size differs can return uninitialized memory.
    # This one IS reachable: rqmd opens `index.sqlite` in WAL mode
    # (crates/rqmd-core/src/db.rs:25) with the bundled SQLite. A repo can ship
    # a crafted `.rqmd/index.sqlite` plus `-wal` pair, and any rqmd command run
    # inside that clone opens it implicitly (`resolve_index_dir`,
    # crates/rqmd-cli/src/store.rs:36-39), with no flag as there is for hooks.
    # The leak is process memory returned by ordinary queries, and the attack
    # is local, but it needs no step beyond running rqmd in a cloned repo.
    # Mitigated for the advisory's trigger only: `check_wal_matches_db`
    # (crates/rqmd-core/src/db.rs, called from `open_db` and from the
    # read-only open in crates/rqmd-cli/src/commands/watch.rs) refuses a
    # `-wal` whose page size differs from the database's. Other crafted
    # indexes still open. Accepted until the bump, not dismissed.
    # The patched libsqlite3-sys 0.39 comes with rusqlite 0.41, which is on
    # the hand-only bump list (it can change stored data).
    # lean: remove with the reviewed rusqlite 0.41 bump; rusqlite 0.41.0 and
    # libsqlite3-sys 0.39.1 pass the 30-day soak on 2026-11-23 and 2026-11-24.
    "RUSTSEC-2026-0459",
]
