[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.20.0"
rust-version = "1.88"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# dist profile: maximally optimized + stripped for release binaries.
# Usage: cargo build --profile dist -p rqmd-cli
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
