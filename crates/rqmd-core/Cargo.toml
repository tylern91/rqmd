[package]
name = "rqmd-core"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "rqmd core engine — BM25 + vector hybrid search with RRF fusion"
repository = "https://github.com/tylern91/rqmd"
keywords = ["search", "tantivy", "bm25", "vector-search", "rag"]
categories = ["text-processing", "database"]
publish = false

[lints]
workspace = true

[features]
# AST-aware chunking for source code (function/method/class boundaries) via
# tree-sitter. Off by default: adds five grammar dependencies and increases
# build time for a capability only source-code collections need.
ast-chunking = [
    "dep:tree-sitter",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-java",
    "dep:tree-sitter-python",
]

[dependencies]
anyhow = "1"
rqmd-llm = { path = "../rqmd-llm" }
tracing = "0.1"
regex = "1"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["std"] }
hex = "0.4"
tantivy = "0.26"
usearch = "2.25"
globset = "0.4"
tree-sitter = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.25", optional = true }

[dev-dependencies]
tempfile = "3"
