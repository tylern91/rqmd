[package]
name = "rqmd-core"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "rqmd core engine — BM25 + vector hybrid search with RRF fusion"
repository = "https://github.com/tylern91/rqmd"
keywords = ["search", "tantivy", "bm25", "vector-search", "rag"]
categories = ["text-processing", "database"]
publish = false

[lints]
workspace = true

[features]
# AST-aware chunking for source code (declaration boundaries) via tree-sitter.
# Off by default: each grammar adds a dependency and build time for a
# capability only source-code collections need. `ast-chunking` turns on every
# language; one `ast-<language>` feature adds a single grammar.
ast-chunking = [
    "ast-typescript",
    "ast-javascript",
    "ast-java",
    "ast-python",
    "ast-go",
    "ast-rust",
    "ast-csharp",
    "ast-kotlin",
    "ast-swift",
    "ast-hcl",
    "ast-sql",
]
# The parser runtime and registry every language feature builds on.
ast-registry = ["dep:tree-sitter"]
ast-typescript = ["ast-registry", "dep:tree-sitter-typescript"]
ast-javascript = ["ast-registry", "dep:tree-sitter-javascript"]
ast-java = ["ast-registry", "dep:tree-sitter-java"]
ast-python = ["ast-registry", "dep:tree-sitter-python"]
ast-go = ["ast-registry", "dep:tree-sitter-go"]
ast-rust = ["ast-registry", "dep:tree-sitter-rust"]
ast-csharp = ["ast-registry", "dep:tree-sitter-c-sharp"]
ast-kotlin = ["ast-registry", "dep:tree-sitter-kotlin-ng"]
ast-swift = ["ast-registry", "dep:tree-sitter-swift"]
ast-hcl = ["ast-registry", "dep:tree-sitter-hcl"]
ast-sql = ["ast-registry", "dep:tree-sitter-sequel"]

[dependencies]
anyhow = "1"
rqmd-llm = { path = "../rqmd-llm" }
tracing = "0.1"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
unicode-normalization = "0.1.25"
tantivy = "0.26"
usearch = "2.25"
globset = "0.4"
tree-sitter = { version = "0.26", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
# Pinned: 0.7.4 is younger than the 30-day dependency soak.
tree-sitter-swift = { version = "=0.7.3", optional = true }
tree-sitter-hcl = { version = "1.1", optional = true }
tree-sitter-sequel = { version = "0.3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
