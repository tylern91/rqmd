name: release
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      label:
        description: "major|minor|patch — the version bump to cut"
        required: true
        type: choice
        options: [patch, minor, major]
      pr_number:
        description: "PR number this release covers, for release-notes provenance. Optional."
        type: string
        default: ""
      dry_run:
        description: "Compute and print the tag + notes without creating them"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >
      vars.RELEASE_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.merged == true &&
        (contains(github.event.pull_request.labels.*.name, 'major') ||
         contains(github.event.pull_request.labels.*.name, 'minor') ||
         contains(github.event.pull_request.labels.*.name, 'patch')) &&
        !contains(github.event.pull_request.labels.*.name, 'skip-release')))
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.next }}
      latest: ${{ steps.ver.outputs.latest }}
      label: ${{ steps.ctx.outputs.label }}
      breaking: ${{ steps.ctx.outputs.breaking }}
      pr_number: ${{ steps.ctx.outputs.pr_number }}
      created: ${{ steps.mark.outputs.created }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
      IN_LABEL: ${{ inputs.label }}
      IN_PR_NUMBER: ${{ inputs.pr_number }}
      IN_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Mint release token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: tylern91
          repositories: rqmd

      # persist-credentials left at its default (true): the "Create and push
      # tag" step below needs the credential actions/checkout wires into
      # .git/config to push the tag. A plain GITHUB_TOKEN (a GitHub App
      # installation token scoped to this run) cannot push a tag against a
      # commit whose tree touches .github/workflows/* — the App-minted token
      # above carries the Workflows permission that push needs.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve release context
        # Normalizes both trigger shapes (PR-merge vs. manual dispatch) into
        # one set of outputs so every step downstream reads the same names
        # regardless of which one fired. The explicit major/minor/patch
        # label (or dispatch input) always sets the version bump.
        # breaking-change/!/BREAKING CHANGE: are informational only —
        # pre-1.0, breaking changes take the minor slot, not major — and
        # only control the release-notes callout in build-release-notes.sh.
        id: ctx
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            label="$IN_LABEL"
            pr_number="$IN_PR_NUMBER"
            dry_run="$IN_DRY_RUN"
            breaking=false
            if [ -n "$pr_number" ]; then
              title="$(gh pr view "$pr_number" --json title -q .title)"
              body="$(gh pr view "$pr_number" --json body -q .body)"
              if printf '%s' "$title" | grep -qE '^[a-z]+(\([^)]+\))?!:' \
                  || printf '%s' "${body:-}" | grep -qE '^BREAKING CHANGE:'; then
                breaking=true
              fi
            fi
          else
            label="$(jq -nr --argjson l "$PR_LABELS" 'first(["major","minor","patch"][] | select(IN($l[]))) // empty')"
            pr_number="$PR_NUMBER"
            breaking=false
            if printf '%s' "$PR_LABELS" | jq -e 'index("breaking-change") != null' >/dev/null 2>&1 \
                || printf '%s' "$PR_TITLE" | grep -qE '^[a-z]+(\([^)]+\))?!:' \
                || printf '%s' "${PR_BODY:-}" | grep -qE '^BREAKING CHANGE:'; then
              breaking=true
            fi
            dry_run=false
            if printf '%s' "${PR_BODY:-}" | grep -qF '<!-- release-dry-run -->'; then
              dry_run=true
            fi
          fi
          printf 'label=%s\n'     "$label"     >> "$GITHUB_OUTPUT"
          printf 'breaking=%s\n'  "$breaking"  >> "$GITHUB_OUTPUT"
          printf 'pr_number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"
          printf 'dry_run=%s\n'   "$dry_run"   >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          latest="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)"
          next="$(bash scripts/bump-version.sh "$latest" "${{ steps.ctx.outputs.label }}")"
          printf 'latest=%s\n' "$latest" >> "$GITHUB_OUTPUT"
          printf 'next=%s\n'   "$next"   >> "$GITHUB_OUTPUT"

      - name: Idempotency guard
        id: guard
        run: |
          if git rev-parse "${{ steps.ver.outputs.next }}" >/dev/null 2>&1; then
            echo "::notice::Tag ${{ steps.ver.outputs.next }} already exists — skipping release"
            printf 'skip=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'skip=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp commit/PR refs into this release's CHANGELOG section
        # Stamps CHANGELOG.md in THIS ephemeral checkout only — never committed
        # or pushed back to main (the branch ruleset's bypass_actors is null,
        # so not even this job's own token can push to main directly). The tag
        # computed above doesn't exist yet at this point, so STAMP_HEAD_REF
        # tells the script to diff against HEAD instead of requiring the tag.
        if: steps.guard.outputs.skip == 'false'
        env:
          STAMP_HEAD_REF: HEAD
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.next }}"
          bash scripts/stamp-changelog-refs.sh "${version#v}"

      - name: Build release notes
        if: steps.guard.outputs.skip == 'false'
        run: |
          bash scripts/build-release-notes.sh \
            "${{ steps.ver.outputs.next }}" \
            "${{ steps.ctx.outputs.label }}" \
            "${{ steps.ctx.outputs.breaking }}" \
            --from-existing \
            --prev "${{ steps.ver.outputs.latest }}" \
            > /tmp/RELEASE_BODY.md

      - name: Guard against empty release notes
        id: notes_guard
        if: steps.guard.outputs.skip == 'false'
        run: |
          size="$(tr -d '[:space:]' < /tmp/RELEASE_BODY.md | wc -c | tr -d ' ')"
          if [ "$size" -lt 10 ]; then
            echo "::notice::[Unreleased] section is empty — skipping tag + release"
            printf 'empty=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'empty=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Import GPG key
        id: gpg
        if: steps.guard.outputs.skip == 'false'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is not set — refusing to publish an unsigned release tag"
            exit 1
          fi

          # Accept a raw ASCII-armored export or a base64-wrapped one. Storing
          # the key base64-encoded is a common habit, and the failure it
          # produces here is opaque ("no valid OpenPGP data found", exit 2).
          key="$GPG_PRIVATE_KEY"
          case "$key" in
            *"BEGIN PGP PRIVATE KEY BLOCK"*) ;;
            *) key="$(printf '%s' "$key" | tr -d '[:space:]' | base64 -d 2>/dev/null || true)" ;;
          esac

          case "$key" in
            *"BEGIN PGP PRIVATE KEY BLOCK"*) ;;
            *)
              # Never echo the secret — report only its shape, enough to tell
              # wrong-format from wrong-key from truncated-paste.
              echo "::error::GPG_PRIVATE_KEY is neither ASCII-armored nor base64-wrapped ASCII-armored OpenPGP."
              echo "::error::  stored length: ${#GPG_PRIVATE_KEY} bytes; after base64 decode: ${#key} bytes"
              echo "::error::  Re-upload with: gpg --armor --export-secret-keys <KEY_ID> | gh secret set GPG_PRIVATE_KEY"
              exit 1
              ;;
          esac

          printf '%s\n' "$key" | gpg --batch --import
          printf 'default-cache-ttl 7200\n' >> ~/.gnupg/gpg-agent.conf
          printf 'allow-loopback-pinentry\n' >> ~/.gnupg/gpg-agent.conf
          printf 'pinentry-mode loopback\n'  >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent
          if ! printf '%s' "$GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --sign -o /dev/null <(printf 'test'); then
            echo "::error::Test sign failed — GPG_PASSPHRASE does not unlock the imported key, or GPG_KEY_ID doesn't match it."
            echo "::error::  imported secret keys:"
            gpg --list-secret-keys --keyid-format=long | grep -E '^sec' || echo "::error::  (none imported)"
            echo "::error::  GPG_KEY_ID secret: $GPG_KEY_ID"
            exit 1
          fi
          git config user.signingkey "$GPG_KEY_ID"
          git config tag.gpgsign true
          printf 'signed=true\n' >> "$GITHUB_OUTPUT"

      - name: Configure git committer
        if: steps.guard.outputs.skip == 'false'
        env:
          GPG_SIGNED: ${{ steps.gpg.outputs.signed }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "tylern91@users.noreply.github.com"
          git config commit.gpgsign "${GPG_SIGNED:-false}"

      - name: Create and push tag
        if: >
          steps.guard.outputs.skip == 'false' &&
          steps.notes_guard.outputs.empty == 'false' &&
          steps.ctx.outputs.dry_run != 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.next }}"
          if [ "${{ steps.gpg.outputs.signed }}" = "true" ]; then
            git tag -s "$tag" -F /tmp/RELEASE_BODY.md
          else
            echo "::error::GPG signing was not established — refusing to publish an unsigned release tag"
            exit 1
          fi
          git push origin "$tag"

      - name: Create GitHub Release
        if: >
          steps.guard.outputs.skip == 'false' &&
          steps.notes_guard.outputs.empty == 'false' &&
          steps.ctx.outputs.dry_run != 'true'
        run: |
          gh release create "${{ steps.ver.outputs.next }}" \
            --title "${{ steps.ver.outputs.next }}" \
            --notes-file /tmp/RELEASE_BODY.md \
            --latest \
            --verify-tag

      - name: Dry-run notice
        if: >
          steps.guard.outputs.skip == 'false' &&
          steps.notes_guard.outputs.empty == 'false' &&
          steps.ctx.outputs.dry_run == 'true'
        run: |
          echo "::notice::<!-- release-dry-run --> — would create tag ${{ steps.ver.outputs.next }} with the following notes:"
          cat /tmp/RELEASE_BODY.md

      - name: Mark release created
        id: mark
        if: >
          steps.guard.outputs.skip == 'false' &&
          steps.notes_guard.outputs.empty == 'false' &&
          steps.ctx.outputs.dry_run != 'true'
        run: printf 'created=true\n' >> "$GITHUB_OUTPUT"

  publish:
    name: Publish assets, notes, and Homebrew sync
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/publish-assets.yml
    with:
      tag:       ${{ needs.release.outputs.version }}
      label:     ${{ needs.release.outputs.label }}
      breaking:  ${{ needs.release.outputs.breaking }}
      prev:      ${{ needs.release.outputs.latest }}
      pr_number: ${{ needs.release.outputs.pr_number }}
    secrets: inherit
