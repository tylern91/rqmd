name: Nix

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix.yml"
  pull_request:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on PRs only; each push to main keeps its own run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-flake:
    name: Flake check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04-arm, macos-26]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate flake structure
        run: nix flake check --no-build

      - name: Verify dev shell provides Rust toolchain
        run: nix develop --command cargo --version

      # Full `nix build .` is a follow-up: llama-cpp-2 bundles a CMake-based
      # C++ library (llama.cpp) that requires cmake ≥3.14 (4.x supported) and
      # Metal frameworks on macOS. Sandbox reproducibility needs additional testing. Track in CHANGELOG.
