name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "CHANGELOG.md"
      - "scripts/check-version-sync.sh"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "CHANGELOG.md"
      - "scripts/check-version-sync.sh"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check Cargo.toml version matches CHANGELOG
        run: bash scripts/check-version-sync.sh

  build-macos:
    name: Build ${{ matrix.feature-set }} (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - feature-set: default
            cargo-args: ""
          - feature-set: ort-backend
            cargo-args: "-p rqmd-cli --features ort-backend"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: macos-arm64-${{ matrix.feature-set }}
          cache-on-failure: true

      - name: Check formatting
        if: matrix.feature-set == 'default'
        run: cargo fmt --all --check

      - name: Clippy (workspace)
        if: matrix.feature-set == 'default'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build (default)
        if: matrix.feature-set == 'default'
        run: cargo build --workspace --locked

      - name: Build (ort-backend)
        if: matrix.feature-set == 'ort-backend'
        run: cargo build --locked ${{ matrix.cargo-args }}

      - name: Tests (workspace, incl. integration — no model downloads)
        if: matrix.feature-set == 'default'
        run: cargo test --workspace --locked

      - name: Search quality eval (BM25, no model required)
        if: matrix.feature-set == 'default'
        run: cargo run --locked --bin rqmd -- eval --mode bm25

  build-linux:
    name: Build default (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          # llama-cpp-2 on Linux needs cmake and a C++ toolchain
          sudo apt-get install -y cmake build-essential

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: linux-x64-default
          cache-on-failure: true

      - name: Build (default, Linux CPU-only — no Metal)
        # llama-cpp-2 on Linux uses CPU path; metal feature is macOS-only
        env:
          # Force CPU-only llama.cpp build on Linux (no CUDA in free runners)
          LLAMA_METAL: "0"
        run: cargo build --workspace --locked

      - name: Tests (workspace, incl. integration)
        env:
          LLAMA_METAL: "0"
        run: cargo test --workspace --locked

  dist-binary:
    name: Release binary (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 60
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-macos, build-linux]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: macos-arm64-dist
          cache-on-failure: true

      - name: Build dist binary
        run: cargo build --profile dist -p rqmd-cli --locked

      - name: Show binary info
        run: |
          ls -lh target/dist/rqmd
          file target/dist/rqmd
          otool -L target/dist/rqmd | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rqmd-macos-arm64
          path: target/dist/rqmd
          retention-days: 30
