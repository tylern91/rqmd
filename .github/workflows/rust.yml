name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "CHANGELOG.md"
      - "scripts/check-version-sync.sh"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "CHANGELOG.md"
      - "scripts/check-version-sync.sh"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  version-sync:
    name: Version sync
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check Cargo.toml version matches CHANGELOG
        run: bash scripts/check-version-sync.sh

  build-macos:
    name: Build ${{ matrix.feature-set }} (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - feature-set: default
            cargo-args: ""
          - feature-set: ort-backend
            cargo-args: "-p rqmd-cli --features ort-backend"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64-${{ matrix.feature-set }}
          cache-on-failure: true

      - name: Check formatting
        if: matrix.feature-set == 'default'
        run: cargo fmt --all --check

      - name: Clippy (workspace)
        if: matrix.feature-set == 'default'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build (default)
        if: matrix.feature-set == 'default'
        run: cargo build --workspace --locked

      - name: Build (ort-backend)
        if: matrix.feature-set == 'ort-backend'
        run: cargo build --locked ${{ matrix.cargo-args }}

      - name: Tests (workspace, incl. integration — no model downloads)
        if: matrix.feature-set == 'default'
        run: cargo test --workspace --locked

      - name: Search quality eval (BM25, no model required)
        if: matrix.feature-set == 'default'
        run: cargo run --locked --bin rqmd -- eval --mode bm25

  build-linux:
    name: Build default (Linux ${{ matrix.arch }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # The MSRV (1.88) leg is a drift check, not a release gate — its failure
    # must not block dist-binary or show as a required-check failure.
    continue-on-error: ${{ matrix.toolchain != 'stable' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: stable
            os: ubuntu-26.04
            arch: x64
          - toolchain: stable
            os: ubuntu-26.04-arm
            arch: arm64
          - toolchain: "1.88"
            os: ubuntu-26.04
            arch: x64

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          # llama-cpp-2 on Linux needs cmake and a C++ toolchain
          sudo apt-get install -y cmake build-essential

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}-${{ matrix.toolchain }}
          cache-on-failure: true

      - name: Build (default, Linux CPU-only — no Metal)
        # llama-cpp-2 on Linux uses CPU path; metal feature is macOS-only
        env:
          # Force CPU-only llama.cpp build on Linux (no CUDA in free runners)
          LLAMA_METAL: "0"
        run: cargo build --workspace --locked

      - name: Tests (workspace, incl. integration)
        env:
          LLAMA_METAL: "0"
        run: cargo test --workspace --locked

  dist-binary:
    name: Release binary (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 60
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-macos, build-linux]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64-dist
          cache-on-failure: true

      - name: Build dist binary
        run: cargo build --profile dist -p rqmd-cli --locked

      - name: Show binary info
        run: |
          ls -lh target/dist/rqmd
          file target/dist/rqmd
          otool -L target/dist/rqmd | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rqmd-macos-arm64
          path: target/dist/rqmd
          retention-days: 30

  ac-gate:
    name: Acceptance-criteria gate
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # revert-evidence (check 4) diffs ac_* tests against origin/main.
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ac-gate
          cache-on-failure: true

      - name: Lint acceptance tests
        run: bash scripts/lint-acceptance-tests.sh

      - name: Run acceptance tests
        run: bash scripts/run-acceptance-tests.sh

      - name: Check 1 — reverse-orphan (every ac_N on disk is in acceptance.json)
        run: |
          set -Eeuo pipefail
          missing=0
          while IFS= read -r fn; do
            key="$(printf '%s\n' "$fn" | sed -E 's/::ac_([0-9]+)_.*/::AC-\1/')"
            if ! jq -e --arg k "$key" '.acceptance[$k]' acceptance.json > /dev/null; then
              printf '::error::reverse-orphan: %s (key %s) has no acceptance.json entry\n' "$fn" "$key" >&2
              missing=1
            fi
          done < <(grep -rhoE '^fn ac_[0-9]+_[a-zA-Z0-9_]+' crates/rqmd-cli/tests/acceptance/*.rs \
                     | sed -E 's/^fn //' \
                     | while read -r name; do
                         file="$(grep -lE "^fn ${name}\\(" crates/rqmd-cli/tests/acceptance/*.rs | head -1)"
                         suite="$(basename "$file" .rs)"
                         printf '%s::%s\n' "$suite" "$name"
                       done)
          if [[ $missing -ne 0 ]]; then
            exit 1
          fi
          printf 'PASS:ac-gate:reverse-orphan\n'

      - name: Check 2 — forward-orphan (every acceptance.json key resolves to a real test)
        run: |
          set -Eeuo pipefail
          missing=0
          while IFS= read -r key; do
            suite="${key%%::AC-*}"
            fn="$(jq -r --arg k "$key" '.acceptance[$k].fn' acceptance.json)"
            name="${fn#*::}"
            file="crates/rqmd-cli/tests/acceptance/${suite}.rs"
            if [[ ! -f "$file" ]] || ! grep -qE "^fn ${name}\(" "$file"; then
              printf '::error::forward-orphan: %s (fn %s) does not resolve to a real test\n' "$key" "$fn" >&2
              missing=1
            fi
          done < <(jq -r '.acceptance | keys[]' acceptance.json)
          if [[ $missing -ne 0 ]]; then
            exit 1
          fi
          printf 'PASS:ac-gate:forward-orphan\n'

      - name: Check 3 — all-passed (no skips or failures in this tier)
        run: |
          set -Eeuo pipefail
          bad="$(jq '[.acceptance | to_entries[] | select(.value.state != "passed")] | length' acceptance.json)"
          if [[ "$bad" -ne 0 ]]; then
            jq -r '.acceptance | to_entries[] | select(.value.state != "passed") | "::error::all-passed: \(.key) is \(.value.state)"' acceptance.json >&2
            exit 1
          fi
          printf 'PASS:ac-gate:all-passed\n'

      - name: Check 4 — revert-evidence (every new/changed ac_N has a ledger row)
        run: |
          set -Eeuo pipefail
          ledger="crates/rqmd-cli/tests/acceptance/revert-ledger.tsv"
          changed="$(git diff --name-only origin/main...HEAD -- 'crates/rqmd-cli/tests/acceptance/*.rs' \
                       | grep -v '/helpers\.rs$' || true)"
          if [[ -z "$changed" ]]; then
            printf 'SKIP:ac-gate:revert-evidence:no-new-or-changed-acs\n'
            exit 0
          fi
          missing=0
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            suite="$(basename "$file" .rs)"
            while IFS= read -r ac; do
              if ! awk -F'\t' -v s="$suite" -v a="$ac" \
                   '$1 == s && $2 == a { found=1 } END { exit !found }' "$ledger"; then
                printf '::error::revert-evidence: %s::ac_%s has no row in %s\n' "$suite" "$ac" "$ledger" >&2
                missing=1
              fi
            done < <(grep -oE '^fn ac_[0-9]+_' "$file" | sed -E 's/^fn ac_([0-9]+)_/\1/')
          done <<< "$changed"
          if [[ $missing -ne 0 ]]; then
            exit 1
          fi
          printf 'PASS:ac-gate:revert-evidence\n'
